# =============================================================================
# VideoAI — Central Configuration
# -----------------------------------------------------------------------------
# Everything swappable lives here. No model names or paths are hardcoded in
# the application code. Paths are relative to the project root.
#
# HARDWARE NOTE (NVIDIA T1000, 4 GB VRAM):
# HARDWARE NOTE (NVIDIA T1000, 4 GB VRAM):
#   The three heavy models (ASR, embeddings, LLM) are NEVER co-resident.
#     - ASR (faster-whisper) runs on CPU in int8 by default (device: auto falls
#       back to CPU when the CUDA cuBLAS/cuDNN runtime is absent). small/int8 is
#       faster than real time, so this costs 0 VRAM and stays fast.
#     - Embeddings run on CPU -> zero VRAM contention.
#     - The LLM (Ollama) is the only GPU consumer, and only during chat
#       (~2.1 GB for qwen2.5:3b-instruct, leaving ~1 GB headroom).
# =============================================================================

app:
  db_path: data/videoai.db
  log_level: INFO

paths:
  videos_dir: data/videos
  audio_dir: data/audio
  transcripts_dir: data/transcripts
  models_dir: models          # local Hugging Face cache for the embedding model

# ------------------------------------------------------------------ ASR -----
asr:
  # tiny | base | small | medium   (large-v3 is intentionally NOT allowed here)
  model_size: small
  device: auto                # auto -> try CUDA, fall back to CPU automatically
  compute_type: int8          # int8 (cpu) | int8_float16 (gpu) | float16 (gpu)
  language: null              # null = auto-detect; set "fa" to force Persian
  beam_size: 5
  vad_filter: true            # voice-activity detection trims silence
  download_root: models       # cache faster-whisper weights under models/

# -------------------------------------------------------------- Chunking ----
chunking:
  target_seconds: 30          # aim to merge raw segments into ~30s chunks
  max_seconds: 45             # never let a chunk exceed this duration
  max_chars: 700              # ...or this many characters
  min_chars: 40               # avoid tiny trailing fragments when possible

# ------------------------------------------------------------- Embedding ----
embedding:
  # Multilingual model with solid Persian coverage. Do NOT use English-only.
  model_name: intfloat/multilingual-e5-small   # or intfloat/multilingual-e5-base
  device: cpu                 # cpu keeps the 4 GB VRAM free for ASR / LLM
  batch_size: 16
  normalize: true             # L2-normalize -> cosine == dot product
  # e5 models require these instruction prefixes to work well:
  query_prefix: "query: "
  passage_prefix: "passage: "

# ----------------------------------------------------------- VectorStore ----
vectorstore:
  backend: numpy              # numpy (implemented) | chroma | faiss (future)
  top_k: 5

# ------------------------------------------------------------------ LLM -----
llm:
  backend: ollama             # ollama (implemented) | llamacpp (future)
  model: qwen2.5:3b-instruct  # swappable: any Ollama model tag
  host: http://localhost:11434
  temperature: 0.2
  num_ctx: 4096
  max_tokens: 1024
  # "5m" keeps the model warm; "0" unloads it from VRAM after each response.
  keep_alive: "5m"
  request_timeout: 180

# ------------------------------------------------------------------ RAG -----
rag:
  top_k: 5                    # how many chunks to retrieve as context
  min_score: 0.10             # drop chunks below this cosine similarity
  language: auto              # auto = answer in the question's language
